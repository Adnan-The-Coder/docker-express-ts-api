name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # 1️⃣ Install, build, and test all workspaces
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Install dependencies (workspace-aware)
        run: pnpm install --frozen-lockfile

      - name: TypeScript Build Check (all packages)
        run: pnpm -r build

      - name: Run tests (all packages)
        run: pnpm -r test || echo "No tests found"

  # 2️⃣ Build Docker image (only after tests pass)
  docker-build:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false # only build & test image, no pushing
          tags: express-ts-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
