name: Deploy to Render

on:
  push:
    branches: ["main"]

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/express-ts-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/express-ts-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render-deploy:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        id: deploy
        run: |
          DEPLOY_RESPONSE=$(curl -s -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -d '{}')

          echo "$DEPLOY_RESPONSE"
          DEPLOY_ID=$(echo "$DEPLOY_RESPONSE" | jq -r '.id')
          echo "DEPLOY_ID=$DEPLOY_ID" >> $GITHUB_ENV

      - name: Stream Render Logs
        run: |
          echo "🔄 Streaming logs for Deploy ID: $DEPLOY_ID"
          OFFSET=0
          while true; do
            LOGS=$(curl -s "https://api.render.com/v1/deploys/$DEPLOY_ID/logs?offset=$OFFSET" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}")

            NEW_LOGS=$(echo "$LOGS" | jq -r '.logs')
            NEXT_OFFSET=$(echo "$LOGS" | jq -r '.nextOffset')

            if [ "$NEW_LOGS" != "null" ] && [ -n "$NEW_LOGS" ]; then
              echo "$NEW_LOGS"
            fi

            OFFSET=$NEXT_OFFSET

            STATUS=$(curl -s "https://api.render.com/v1/deploys/$DEPLOY_ID" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | jq -r '.status')

            if [ "$STATUS" = "live" ]; then
              echo "✅ Deploy succeeded!"
              break
            elif [ "$STATUS" = "failed" ]; then
              echo "❌ Deploy failed!"
              exit 1
            fi

            sleep 10
          done
